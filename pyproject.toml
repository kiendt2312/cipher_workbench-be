[project]
name = "caesar-cipher-be"
version = "0.1.0"
description = "Caesar Cipher Week 1 MVP"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi",
    "python-multipart",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "cryptography>=50.0.2",
    "httpx",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude", "openspec"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["N802", "N803", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing -q --cov-fail-under=90"
markers = ["db: needs PostgreSQL via TEST_DATABASE_URL"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
omit = ["app/**/__init__.py"]
