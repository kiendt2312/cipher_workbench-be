services:
  migrate:
    build: .
    command: ["alembic", "-c", "alembic_sqlite.ini", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - history-data:/data
    restart: "no"

  app:
    build: .
    ports:
      - "${APP_HOST_PORT:-8080}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      HISTORY_API_ENABLED: ${HISTORY_API_ENABLED:-false}
      HISTORY_RETENTION_DAYS: ${HISTORY_RETENTION_DAYS:-30}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
    volumes:
      - history-data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  history-data:
