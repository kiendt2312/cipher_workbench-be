schema: spec-driven

context: |
  Dự án: Caesar Cipher Web App - Tuần 1 MVP (học tập, minh họa thuật toán).
  Tài liệu gốc (source of truth): "BE Scope – Week 1 Caesar Cipher MVP.docx" v1.0 (đã thống nhất).
  Mockup giao diện: Caesar_Cipher_Tool_Demo.html (tham chiếu hành vi UI, KHÔNG phải source of truth
  cho giới hạn/thông báo lỗi - khi mâu thuẫn thì theo docx).

  Tech stack (đã chốt):
  - Python 3.12, FastAPI + uvicorn, chỉ phục vụ API; UI thuộc project FE riêng (FE proxy `/api`; CORS chỉ bật khi đặt `CORS_ALLOW_ORIGINS`)
  - Quản lý dependency bằng uv (pyproject.toml)
  - Test: pytest + pytest-cov, coverage backend tối thiểu 90%
  - Lint/format: Ruff (check + format)
  - Docker: Dockerfile multi-stage; app chạy cổng 8000 cho cả local lẫn Docker
  - Database (tùy chọn, bật bằng DATABASE_URL): PostgreSQL 17, SQLAlchemy 2.x async + asyncpg,
    migration bằng Alembic, môi trường local qua docker-compose (db + migrate + app)

  Ràng buộc nghiệp vụ chốt từ docx (ưu tiên hơn HTML demo):
  - Dung lượng file tối đa 5 MiB (5 * 1024 * 1024 bytes); đúng 5 MiB thì nhận, 5 MiB + 1 byte thì từ chối
  - Tên file kết quả: <ten-goc>.encrypted.txt / <ten-goc>.decrypted.txt (dùng dấu chấm, KHÔNG dùng gạch dưới)
  - Endpoint file hỗ trợ response_mode = content | file (mặc định content)
  - Giữ UTF-8 BOM ở file tải xuống nếu file đầu vào có BOM
  - Thông báo lỗi tiếng Việt theo đúng bảng validation trong docx mục 5, không lộ stack trace ra UI
  - Không lưu nội dung người dùng (input/key/file/kết quả); chỉ lưu metadata thao tác vào PostgreSQL

  Quy ước:
  - Toàn bộ text hướng tới người dùng cuối bằng tiếng Việt
  - Artifact OpenSpec viết bằng tiếng Việt
  - Không tạo abstract cipher interface hay repository pattern ở Tuần 1

rules:
  proposal:
    - Nêu rõ các điểm mâu thuẫn giữa docx và HTML demo đã được giải quyết thế nào
    - Có mục "Ngoài phạm vi" bám theo docx mục 8
  specs:
    - Mỗi requirement phải truy vết tới nguồn có thẩm quyền; thông thường là mục DOCX quản trị tương ứng (ví dụ "docx §2.4"), còn khi không có DOCX có thẩm quyền thì được dùng tập nguồn hoặc decision record do chủ sở hữu phê duyệt rõ ràng nếu requirement dẫn chiếu cụ thể (ví dụ "quyết định chủ sở hữu cho change này") theo thứ tự ưu tiên đã chốt; không chấp nhận requirement không có truy vết
    - Scenario phải phủ đủ bảng validation docx mục 5 gồm HTTP status và thông báo chính xác
    - Ngoại lệ hạ tầng ngoài docx chỉ được thêm khi chủ sở hữu phê duyệt rõ ràng; phải gắn nhãn "ngoại lệ hạ tầng được chủ sở hữu phê duyệt", không được sửa hoặc trình bày sai nguồn sự thật nghiệp vụ trong docx
  tasks:
    - Chia task theo module (Caesar Core, File Processing, HTTP Adapter, Exception Handling, Test, Docker)
    - Mỗi task tối đa khoảng 2 giờ và ghi rõ tiêu chí hoàn thành
